schema_version: 1
model_id: m02_soft_composite
stage_id: m02_evidence_block_inference_experiments
description: >-
  Six isolated and one combined evidence-block experiments around the frozen
  student_t_7_combined model. Every candidate retains fixed nu=7 Student-t
  emissions, OLS VAR(1), partial defining releases, score construction, and
  mapping uncertainty. The selected baseline consumes only the legacy v1
  observation models even though candidate rows are present.

model_selection:
  baseline: student_t_7_combined
  major_benchmarks: [transition_only, partial_only]
  role_vocabulary: [baseline, major_benchmark, sensitivity]
  selection_status: experiment_only_no_candidate_promoted
  rationale: >-
    Evidence-set gating holds the selected baseline fixed. Each priority is an
    isolated sensitivity; candidate_all_six tests their joint effect. Promotion
    requires causal out-of-sample evidence and is outside this experiment.

sources:
  base_filter_config: configs/models/m02_event_driven_bayesian_filter.yaml
  score_manifest: data/manifests/m02_soft_composite.json
  score_features: data/processed/m02_soft_composite/composite_scores.csv
  defining_components: >-
    data/processed/m02_soft_composite/first_release_components_long.csv
  mapping_manifest: data/manifests/m02_probability_map.json
  mapping_history: >-
    results/published/m02_soft_composite/probability_map/quadrant_probabilities.csv
  evidence_manifest: data/manifests/m02_evidence_block_experiments.json
  evidence_events: >-
    data/processed/m02_soft_composite/evidence_block_experiments/extended_release_events.csv
  baseline_sensitivity_manifest: data/manifests/m02_inference_sensitivities.json
  baseline_evaluation_rows: >-
    data/processed/m02_soft_composite/inference_sensitivities/evaluation_rows.csv
  baseline_event_update_audit: >-
    data/processed/m02_soft_composite/inference_sensitivities/event_update_audit.csv.gz
  baseline_latest_marginals: >-
    results/published/m02_soft_composite/inference_sensitivities/latest_marginals.csv

