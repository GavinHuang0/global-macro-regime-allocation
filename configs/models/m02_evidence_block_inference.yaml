partial_defining_releases:
  enabled: true
  component_weight: 0.25
  minimum_complete_training_months: 60
  covariance_estimator: ledoit_wolf
  covariance_eigenvalue_floor: 1.0e-8
  training_cutoff: complete_score_available_strictly_before_release
  event_value_policy: causally_standardized_first_release_component
  blocks:
    employment_situation:
      components: [payrolls, unemployment_rate, average_hourly_earnings]
    consumer_price_index:
      components: [core_cpi]
    producer_price_index:
      components: [producer_prices]
    industrial_production:
      components: [industrial_production]
    personal_income_and_outlays:
      components: [consumer_activity, core_pce]

student_t_emissions:
  initial_degrees_of_freedom: 7.0
  irls:
    maximum_iterations: 100
    relative_tolerance: 1.0e-8
    minimum_weight: 1.0e-6
  degrees_of_freedom_sensitivity:
    candidates: [7.0]
    selection: fixed_nu_7_with_causal_rolling_origin_ridge_selection
    selection_refresh: annual_start
    minimum_predictive_events: 24

robust_var:
  gaussian_joint_state_retained: true
  covariance_eigenvalue_floor: 1.0e-8
  methods:
    ols:
      family: gaussian

retail_sensitivities:
  stronger_inflation_shrinkage:
    loading_penalties:
      retail_sales_ex_motor_vehicles_log_change: [1.0, 10.0]
      motor_vehicle_sales_log_change: [1.0, 10.0]
  stress_interaction:
    enabled: false
    status: not_part_of_evidence_block_experiment
    identification_audit: not_evaluated_in_this_stage

dependence_diagnostics:
  variant_id: candidate_all_six
  target_usage: >-
    causal-fit retrospective diagnostic using the subsequently completed
    first-release score; never used for live filtering or fit selection
  weekly_response_ids:
    - initial_claims_innovation
    - continued_claims_innovation
  cross_block_lags: [-1, 0, 1]
  minimum_pair_observations: 12
  serial_significance_level: 0.05
  exact_same_publication_pair:
    left_model_id: weekly_labor_stress
    left_response_id: initial_claims_innovation
    right_model_id: weekly_continued_claims
    right_response_id: continued_claims_innovation

variants:
  - id: transition_only
    model_role: major_benchmark
    non_defining_evidence: false
    partial_defining_releases: false
    emission: gaussian
    var: ols
    retail: baseline_nominal
    evidence_set: legacy_baseline
  - id: partial_only
    model_role: major_benchmark
    non_defining_evidence: false
    partial_defining_releases: true
    emission: gaussian
    var: ols
    retail: baseline_nominal
    evidence_set: legacy_baseline
  - id: student_t_7_combined
    model_role: baseline
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: legacy_baseline
  - id: priority_01_empire_only
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: priority_01_empire_only
  - id: priority_01_philadelphia_only
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: priority_01_philadelphia_only
  - id: priority_01_surveys
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: priority_01_surveys
  - id: priority_02_claims
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: priority_02_claims
  - id: priority_03_consumer
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: priority_03_consumer
  - id: priority_04_housing
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: priority_04_housing
  - id: priority_05_import_prices
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: priority_05_import_prices
  - id: priority_06_backlog
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: priority_06_backlog
  - id: candidate_all_six
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: candidate_all_six

evaluation:
  primary_checkpoint: before_any_defining_release
  initialization_burn_in_months: 4
  information_stage_checkpoints:
    - before_any_defining_release
    - after_employment_situation
    - after_midmonth_defining_releases
    - strict_pre_final_score_day
  paired_block_bootstrap:
    random_seed: 20260722
    replications: 5000
    block_length_months: 12
    confidence_level: 0.95
    samples:
      - full_sample
      - excluding_2020_03_through_2020_05
    variants:
      - priority_01_surveys
      - priority_02_claims
      - priority_03_consumer
      - priority_04_housing
      - priority_05_import_prices
      - priority_06_backlog
      - candidate_all_six
    holm_family:
      - priority_01_surveys
      - priority_02_claims
      - priority_03_consumer
      - priority_04_housing
      - priority_05_import_prices
      - priority_06_backlog
    metrics:
      score_center_negative_log_predictive_density: lower
      quadrant_cross_entropy_to_exact_score_map: lower
      quadrant_brier_distance_to_exact_score_map: lower
      hard_quadrant_correct: higher

