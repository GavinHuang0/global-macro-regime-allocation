schema_version: 1
model_id: m01_deterministic_composite
description: >-
  First-release, equal-weight growth and inflation composites with strictly
  lagged expanding standardization and three-month trailing smoothing.

data:
  # The common point-in-time panel contains exactly 312 reference months.
  reference_start: 2000-06-01
  reference_end: 2026-05-01
  expected_reference_months: 312

  # Earlier vintages are acquired where available to provide standardization
  # history. Core PCE's real-time archive is the binding constraint.
  observation_start: 1989-01-01
  vintage_start: 1990-01-01
  vintage_end: 2026-07-16
  max_release_lag_days: 92

  # BLS did not publish October 2025 core CPI or unemployment observations
  # during the federal shutdown. The missing October level also makes the
  # November same-vintage one-month transformation undefined. These are the
  # only missing component-month pairs accepted by the publication gate.
  expected_missing_component_months:
    unemployment_rate:
      - 2025-10-01
      - 2025-11-01
    core_cpi:
      - 2025-10-01
      - 2025-11-01

features:
  min_history_months: 60
  standard_deviation_ddof: 1
  smoothing_window_months: 3
  component_weight: 0.25
  zero_tie_policy: up

components:
  payrolls:
    axis: growth
    transform: difference
    description: Monthly change in total nonfarm payrolls, thousands of persons.
    sources:
      - series_id: PAYEMS
        release_id: 50

  industrial_production:
    axis: growth
    transform: log_difference
    description: Monthly log change in total industrial production.
    sources:
      - series_id: INDPRO
        release_id: 13

  consumer_activity:
    axis: growth
    transform: log_difference
    description: Monthly log change in real personal consumption expenditures.
    sources:
      - series_id: PCEC96
        release_id: 54

  unemployment_rate:
    axis: growth
    transform: negative_difference
    description: Negative monthly change in the civilian unemployment rate.
    sources:
      - series_id: UNRATE
        release_id: 50

  core_cpi:
    axis: inflation
    transform: log_difference
    description: Monthly log change in CPI excluding food and energy.
    sources:
      - series_id: CPILFESL
        release_id: 10
        vintage_start: 1996-12-12

  core_pce:
    axis: inflation
    transform: log_difference
    description: Monthly log change in the core PCE price index.
    sources:
      - series_id: PCEPILFE
        release_id: 54
        vintage_start: 2000-08-01

  producer_prices:
    axis: inflation
    transform: log_difference
    description: >-
      Monthly log change in seasonally adjusted finished-goods producer prices
      excluding food and energy; official BLS series break is spliced in changes.
    sources:
      - series_id: PPILFE
        release_id: 46
        vintage_start: 1996-12-11
        vintage_end: 2016-02-17
        active_end: 2015-12-01
      - series_id: WPSFD4131
        release_id: 46
        vintage_start: 2015-03-13
        active_start: 2016-01-01

  average_hourly_earnings:
    axis: inflation
    transform: log_difference
    description: >-
      Monthly log change in average hourly earnings of production and
      nonsupervisory employees, total private.
    sources:
      - series_id: AHETPI
        release_id: 50
        vintage_start: 1999-08-06

outputs:
  raw_dir: data/raw/alfred/m01_deterministic_composite
  processed_dir: data/processed/m01_deterministic_composite
  manifest: data/manifests/m01_deterministic_composite.json
  published_dir: results/published/m01_deterministic_composite
