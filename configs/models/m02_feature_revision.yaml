schema_version: 1
model_id: m02_soft_composite
stage_id: feature_revision
experiment_id: m02_feature_revision_v1
description: >-
  Predeclared causal feature-revision experiment for Model 02. The experiment
  removes aggregate housing and monthly JOLTS from every revised profile,
  tests import prices as a direct replacement for intermediate-materials
  input costs, attributes redesigned consumer and business responses through
  add-one and leave-one-out arms, and tests continued claims conditionally on
  same-publication initial claims. Frozen controls are replayed without
  modification. No candidate is promoted merely because it is evaluated by
  this development-stage experiment.

model_selection:
  selected_baseline: student_t_7_combined
  frozen_controls: [transition_only, partial_only, student_t_7_combined]
  predeclared_combined_candidate: all_revised_candidate
  selection_status: development_experiment_no_automatic_promotion
  structural_exclusions:
    - monthly_labor_demand
    - housing_activity
  retained_legacy_models:
    - inflation_expectations
  rationale: >-
    Aggregate housing and the lagged monthly-labor-demand likelihood are
    excluded by design based on the preceding frozen attribution experiment.
    Candidate selection below must use the predeclared proper-score rules and
    remains development evidence because earlier full-sample results have
    already been inspected.

sources:
  base_filter_config: configs/models/m02_event_driven_bayesian_filter.yaml
  baseline_sensitivity_config: configs/models/m02_inference_sensitivities.yaml
  evidence_experiment_config: configs/models/m02_evidence_block_inference.yaml
  evidence_experiment_inference_manifest: data/manifests/m02_evidence_block_inference.json
  score_manifest: data/manifests/m02_soft_composite.json
  score_features: data/processed/m02_soft_composite/composite_scores.csv
  defining_components: >-
    data/processed/m02_soft_composite/first_release_components_long.csv
  mapping_manifest: data/manifests/m02_probability_map.json
  mapping_history: >-
    results/published/m02_soft_composite/probability_map/quadrant_probabilities.csv
  baseline_evidence_manifest: data/manifests/m02_release_evidence.json
  baseline_evidence_events: >-
    data/processed/m02_soft_composite/release_evidence/release_events.csv
  extended_evidence_manifest: data/manifests/m02_evidence_block_experiments.json
  extended_evidence_events: >-
    data/processed/m02_soft_composite/evidence_block_experiments/extended_release_events.csv
  retail_real_decomposition_manifest: data/manifests/m02_retail_sensitivity.json
  retail_real_decomposition_events: >-
    data/processed/m02_soft_composite/inference_sensitivities/retail_real_decomposition_events.csv
  frozen_baseline_manifest: data/manifests/m02_inference_sensitivities.json
  frozen_baseline_evaluation_rows: >-
    data/processed/m02_soft_composite/inference_sensitivities/evaluation_rows.csv
  frozen_baseline_event_update_audit: >-
    data/processed/m02_soft_composite/inference_sensitivities/event_update_audit.csv.gz
  frozen_baseline_partial_defining_audit: >-
    data/processed/m02_soft_composite/inference_sensitivities/partial_defining_audit.csv.gz
  frozen_baseline_exact_score_audit: >-
    data/processed/m02_soft_composite/inference_sensitivities/exact_score_audit.csv
  frozen_baseline_latest_marginals: >-
    results/published/m02_soft_composite/inference_sensitivities/latest_marginals.csv

experiment_contract:
  non_defining_emission: student_t
  degrees_of_freedom: 7.0
  transition_estimator: ols_var1
  partial_defining_releases: true
  evidence_training_window: expanding
  evidence_training_cutoff: strictly_before_scored_release
  same_timestamp_validation: atomic_holdout
  covariance_eigenvalue_floor: 1.0e-8
  structural_exclusions_apply_to: all_noncontrol_variants
  frozen_control_policy: semantic_artifact_invariance_with_float_tolerance
  candidate_role: sensitivity

reused_observation_models:
  weekly_labor_stress:
    source_config: configs/models/m02_event_driven_bayesian_filter.yaml
  weekly_continued_claims:
    source_config: configs/models/m02_evidence_block_inference.yaml
    use: independent_claims_comparator_only
  consumer_demand:
    source_config: configs/models/m02_event_driven_bayesian_filter.yaml
  business_investment:
    source_config: configs/models/m02_event_driven_bayesian_filter.yaml
