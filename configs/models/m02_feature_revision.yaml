variant_defaults:
  model_role: sensitivity
  frozen_control: false
  non_defining_evidence: true
  partial_defining_releases: true
  emission: student_t_7
  var: ols

comparisons:
  price:
    - id: price_import__vs__structural_reduced_input
      candidate_id: price_import
      reference_id: structural_reduced_input
      arm: direct_replacement
    - id: price_import__vs__structural_reduced_no_price
      candidate_id: price_import
      reference_id: structural_reduced_no_price
      arm: add_one
    - id: structural_reduced_input__vs__structural_reduced_no_price
      candidate_id: structural_reduced_input
      reference_id: structural_reduced_no_price
      arm: legacy_add_one

  consumer:
    - id: consumer_real_only__vs__consumer_none
      candidate_id: consumer_real_only
      reference_id: consumer_none
      arm: add_one
      response: real_retail_and_food_services_log_change
    - id: consumer_implicit_only__vs__consumer_none
      candidate_id: consumer_implicit_only
      reference_id: consumer_none
      arm: add_one
      response: implicit_retail_price_log_change
    - id: consumer_vehicle_only__vs__consumer_none
      candidate_id: consumer_vehicle_only
      reference_id: consumer_none
      arm: add_one
      response: total_vehicle_unit_sales_log_change
    - id: consumer_without_real__vs__consumer_revised_full
      candidate_id: consumer_without_real
      reference_id: consumer_revised_full
      arm: leave_one_out
      response: real_retail_and_food_services_log_change
    - id: consumer_without_implicit__vs__consumer_revised_full
      candidate_id: consumer_without_implicit
      reference_id: consumer_revised_full
      arm: leave_one_out
      response: implicit_retail_price_log_change
    - id: consumer_real_implicit_joint_only__vs__consumer_revised_full
      candidate_id: consumer_real_implicit_joint_only
      reference_id: consumer_revised_full
      arm: leave_one_out
      response: total_vehicle_unit_sales_log_change
    - id: consumer_revised_full__vs__consumer_legacy
      candidate_id: consumer_revised_full
      reference_id: consumer_legacy
      arm: direct_replacement

  business:
    - id: business_activity_only__vs__business_none
      candidate_id: business_activity_only
      reference_id: business_none
      arm: add_one
      response: core_capital_goods_shipments_log_change
      primary_atomic: true
    - id: business_pipeline_only__vs__business_none
      candidate_id: business_pipeline_only
      reference_id: business_none
      arm: add_one
      response: core_capital_goods_orders_shipments_gap_log_change
      primary_atomic: true
    - id: business_pipeline_only__vs__business_revised_joint
      candidate_id: business_pipeline_only
      reference_id: business_revised_joint
      arm: leave_one_out
      response: core_capital_goods_shipments_log_change
      primary_atomic: false
    - id: business_activity_only__vs__business_revised_joint
      candidate_id: business_activity_only
      reference_id: business_revised_joint
      arm: leave_one_out
      response: core_capital_goods_orders_shipments_gap_log_change
      primary_atomic: false
    - id: business_revised_joint__vs__business_legacy
      candidate_id: business_revised_joint
      reference_id: business_legacy
      arm: direct_replacement
      primary_atomic: false

  claims:
    - id: claims_icsa_only__vs__claims_none
      candidate_id: claims_icsa_only
      reference_id: claims_none
      arm: add_one
      response: initial_claims_innovation
    - id: claims_ccsa_conditional_only__vs__claims_none
      candidate_id: claims_ccsa_conditional_only
      reference_id: claims_none
      arm: add_one
      response: continued_claims_innovation
    - id: claims_conditional_joint__vs__claims_icsa_only
      candidate_id: claims_conditional_joint
      reference_id: claims_icsa_only
      arm: add_one
      response: continued_claims_innovation
    - id: claims_conditional_joint__vs__claims_ccsa_conditional_only
      candidate_id: claims_conditional_joint
      reference_id: claims_ccsa_conditional_only
      arm: add_one
      response: initial_claims_innovation
    - id: claims_independent__vs__claims_icsa_only
      candidate_id: claims_independent
      reference_id: claims_icsa_only
      arm: independent_add_one
      response: continued_claims_innovation
    - id: claims_conditional_joint__vs__claims_independent
      candidate_id: claims_conditional_joint
      reference_id: claims_independent
      arm: dependence_treatment

  combined:
    - id: all_revised_candidate__vs__student_t_7_combined
      candidate_id: all_revised_candidate
      reference_id: student_t_7_combined
      arm: developmental_combined_vs_selected_baseline
    - id: all_revised_candidate__vs__partial_only
      candidate_id: all_revised_candidate
      reference_id: partial_only
      arm: developmental_combined_vs_major_benchmark

evaluation:
  primary_checkpoint: before_any_defining_release
  initialization_burn_in_months: 4
  information_stage_checkpoints:
    - before_any_defining_release
    - after_employment_situation
    - after_midmonth_defining_releases
    - strict_pre_final_score_day
  metrics:
    primary:
      quadrant_cross_entropy_to_exact_score_map: lower
    confirmatory:
      quadrant_brier_distance_to_exact_score_map: lower
    secondary:
      score_center_negative_log_predictive_density: lower
    descriptive:
      hard_quadrant_correct: higher
  paired_samples:
    - full_common_calendar
  subperiods:
    - full_sample
    - excluding_2020_03_through_2020_05
    - through_2022_12
    - from_2023_01
  subperiod_interpretation:
    from_2023_01: stability_diagnostic_not_untouched_holdout
  paired_block_bootstrap:
    random_seed: 20260722
    replications: 5000
    resampling: segment_aware_circular
    block_length_months: 12
    confidence_level: 0.95
    excluded_interval_policy: independently_resample_contiguous_calendar_segments
  multiplicity:
    method: holm
    apply_separately_by_metric_and_family: true
    families:
      price:
        - price_import__vs__structural_reduced_input
        - price_import__vs__structural_reduced_no_price
        - structural_reduced_input__vs__structural_reduced_no_price
      consumer:
        - consumer_real_only__vs__consumer_none
        - consumer_implicit_only__vs__consumer_none
        - consumer_vehicle_only__vs__consumer_none
        - consumer_without_real__vs__consumer_revised_full
        - consumer_without_implicit__vs__consumer_revised_full
        - consumer_real_implicit_joint_only__vs__consumer_revised_full
        - consumer_revised_full__vs__consumer_legacy
      business:
        - business_activity_only__vs__business_none
        - business_pipeline_only__vs__business_none
        - business_pipeline_only__vs__business_revised_joint
        - business_activity_only__vs__business_revised_joint
        - business_revised_joint__vs__business_legacy
      claims:
        - claims_icsa_only__vs__claims_none
        - claims_ccsa_conditional_only__vs__claims_none
        - claims_conditional_joint__vs__claims_icsa_only
        - claims_conditional_joint__vs__claims_ccsa_conditional_only
        - claims_independent__vs__claims_icsa_only
        - claims_conditional_joint__vs__claims_independent
    combined_comparisons: descriptive_no_multiplicity_claim

promotion_rules:
  structural_exclusions:
    decision: fixed
  inflation_import_prices:
    provisional_replace_input_costs_if:
      - direct_swap_mean_cross_entropy_improves
      - direct_swap_mean_brier_improves
      - no_material_harm_at_later_checkpoints
    otherwise: use_no_price_block_not_legacy_input_costs
  consumer_responses:
    retain_if:
      - nonnegative_cross_entropy_benefit_in_add_one_and_leave_one_out
      - nonnegative_brier_benefit_in_add_one_and_leave_one_out
    score_center_nlpd_role: secondary_diagnostic
  business_responses:
    retain_if:
      - nonnegative_cross_entropy_benefit_in_add_one_and_leave_one_out
      - nonnegative_brier_benefit_in_add_one_and_leave_one_out
    score_center_nlpd_role: secondary_diagnostic
  weekly_claims:
    conditional_model_replaces_icsa_only_if:
      - improves_cross_entropy_and_brier_vs_icsa_only
      - no_worse_cross_entropy_and_brier_than_independent_claims
  statistical_confidence:
    strong_support: >-
      holm_adjusted_p_value_below_0.05_and_unadjusted_percentile_interval_excludes_zero
    otherwise: provisional_directional_evidence
  final_candidate: >-
    The predeclared all-revised candidate is a development sensitivity. Its
    same-sample result cannot be described as an unbiased validation of an
    adaptively selected production baseline.

invariance:
  frozen_variants:
