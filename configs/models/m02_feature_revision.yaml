    economic_block: inflation_pressure
    event_source: extended_evidence_events
    event_block: inflation_import_prices
    responses: [import_prices_ex_food_fuels_computers_12m_log_change]
    controls: []
    transform: same_vintage_log_change_12m
    standardization: expanding_strictly_lagged
    loading_penalties:
      - [0.0, 1.0]
    exact_zero_mask:
      - [true, false]
    minimum_training_samples: 24
    validation_minimum_training_samples: 18
    minimum_validation_observations: 12

  consumer_real_implicit_joint:
