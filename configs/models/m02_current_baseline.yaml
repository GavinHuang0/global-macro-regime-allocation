schema_version: 1
model_id: m02_soft_composite
stage_id: current_baseline
release_id: m02_current_baseline_v1
description: >-
  Immutable publication contract for the declared current Model 02 inference
  baseline. The stage promotes the reduced-core evidence graph selected after
  the feature-revision experiments without modifying any historical
  configuration, manifest, or result namespace. It retains fixed seven-degree-
  of-freedom Student-t emissions, OLS VAR(1) dynamics, sequential partial
  score-defining updates, and exact completed-score conditioning.

model_selection:
  baseline: student_t_7_reduced_core
  engine_major_benchmarks: [transition_only, partial_only]
  publication_benchmarks:
    - transition_only
    - partial_only
    - student_t_7_combined
  frozen_controls:
    - transition_only
    - partial_only
    - student_t_7_combined
  predecessor_baseline: student_t_7_combined
  sensitivities: [student_t_7_reduced_core_with_expectations]
  selection_status: declared_current_baseline_after_same_history_feature_revision
  rationale: >-
    The reduced core keeps the three evidence models supported by the locked
    component experiments: initial claims, the joint real-retail/implicit-price
    consumer response, and the joint capital-goods activity/pipeline response.
    It excludes JOLTS, aggregate housing, both legacy input costs and import
    prices, vehicle sales, and continued claims. Inflation expectations is
    retained only as a named sensitivity because the historical real-time feed
    produced too few applied updates to establish its incremental value.

same_history_disclosure:
  untouched_holdout: false
  adaptive_feature_selection: true
  statement: >-
    The evidence graph was chosen after inspecting attribution and feature-
    revision results on the same causal history used for the comparisons in
    this stage. Declaring student_t_7_reduced_core as the current baseline is a
    model-governance decision for prospective use, not an unbiased validation
    result and not evidence that it will outperform the frozen predecessor or
    either ablation benchmark out of sample.
  required_interpretation: >-
    All replay comparisons are descriptive same-history diagnostics. A future
    untouched period or separately preregistered rolling evaluation is required
    before making a confirmatory performance claim.

immutability:
  historical_configs: read_only
  historical_manifests: read_only
  historical_results: read_only
  current_stage_policy: write_new_namespace_and_manifest_only

sources:
  base_filter_config: configs/models/m02_event_driven_bayesian_filter.yaml
  frozen_sensitivity_config: configs/models/m02_inference_sensitivities.yaml
  feature_revision_config: configs/models/m02_feature_revision.yaml
  feature_revision_manifest: data/manifests/m02_feature_revision.json
  score_features: data/processed/m02_soft_composite/composite_scores.csv
  defining_components: >-
    data/processed/m02_soft_composite/first_release_components_long.csv
  mapping_history: >-
    results/published/m02_soft_composite/probability_map/quadrant_probabilities.csv
  consolidated_event_universe: >-
    data/processed/m02_soft_composite/feature_revision/consolidated_candidate_event_universe.csv
  frozen_evaluation_rows: >-
    data/processed/m02_soft_composite/feature_revision/evaluation_rows.csv
  frozen_event_update_audit: >-
    data/processed/m02_soft_composite/feature_revision/event_update_audit.csv.gz
  frozen_partial_defining_audit: >-
    data/processed/m02_soft_composite/feature_revision/partial_defining_audit.csv.gz
  frozen_exact_score_audit: >-
    data/processed/m02_soft_composite/feature_revision/exact_score_audit.csv
  frozen_latest_marginals: >-
    data/processed/m02_soft_composite/feature_revision/latest_marginals.csv
  feature_revision_registry: >-
    results/published/m02_soft_composite/feature_revision/model_registry.csv
  feature_revision_summary: >-
    results/published/m02_soft_composite/feature_revision/feature_attribution_summary.csv

