experiment_contract:
  non_defining_emission: student_t
  degrees_of_freedom: 7.0
  transition_estimator: ols_var1
  partial_defining_releases: true
  evidence_training_window: expanding
  evidence_training_cutoff: strictly_before_scored_release
  same_timestamp_validation: atomic_holdout
  covariance_eigenvalue_floor: 1.0e-8
  frozen_control_policy: semantic_artifact_invariance_with_float_tolerance
  completed_score_policy: exact_end_of_day_observation

observation_model_sources:
  weekly_labor_stress:
    source_config: configs/models/m02_event_driven_bayesian_filter.yaml
    source_section: observation_models.weekly_labor_stress
    source_events: consolidated_event_universe
  consumer_real_implicit_joint:
    source_config: configs/models/m02_feature_revision.yaml
    source_section: candidate_observation_models.consumer_real_implicit_joint
    source_events: consolidated_event_universe
  business_activity_pipeline_joint:
    source_config: configs/models/m02_feature_revision.yaml
    source_section: candidate_observation_models.business_activity_pipeline_joint
    source_events: consolidated_event_universe
  inflation_expectations:
    source_config: configs/models/m02_event_driven_bayesian_filter.yaml
    source_section: observation_models.inflation_expectations
    source_events: consolidated_event_universe

evidence_sets:
  reduced_core:
    observation_models:
      - weekly_labor_stress
      - consumer_real_implicit_joint
      - business_activity_pipeline_joint
  reduced_core_with_expectations:
    observation_models:
      - weekly_labor_stress
      - consumer_real_implicit_joint
      - business_activity_pipeline_joint
      - inflation_expectations
  legacy_baseline:
    frozen: true
    source_variant: student_t_7_combined
    observation_models:
      - weekly_labor_stress
      - monthly_labor_demand
      - consumer_demand
      - housing_activity
      - business_investment
      - inflation_expectations
      - inflation_input_costs

variants:
  - id: transition_only
    model_role: major_benchmark
    publication_role: major_benchmark
    frozen_control: true
    non_defining_evidence: false
    partial_defining_releases: false
    emission: gaussian
    var: ols
    evidence_set: legacy_baseline
  - id: partial_only
    model_role: major_benchmark
    publication_role: major_benchmark
    frozen_control: true
    non_defining_evidence: false
    partial_defining_releases: true
    emission: gaussian
    var: ols
    evidence_set: legacy_baseline
  - id: student_t_7_combined
    model_role: sensitivity
    publication_role: major_benchmark
    frozen_control: true
    predecessor_baseline: true
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    evidence_set: legacy_baseline
  - id: student_t_7_reduced_core
    model_role: baseline
    publication_role: baseline
    frozen_control: false
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    evidence_set: reduced_core
  - id: student_t_7_reduced_core_with_expectations
    model_role: sensitivity
    publication_role: sensitivity
    frozen_control: false
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    evidence_set: reduced_core_with_expectations

variant_defaults:
  model_role: sensitivity
  publication_role: sensitivity
  frozen_control: false
  non_defining_evidence: true
  partial_defining_releases: true
  emission: student_t_7
  var: ols

comparisons:
  - id: student_t_7_reduced_core__vs__transition_only
    candidate_id: student_t_7_reduced_core
    reference_id: transition_only
    block_id: complete_reduced_core
    experiment_arm: current_baseline_vs_transition_only
    primary_atomic: false
    family: baseline_declaration
  - id: student_t_7_reduced_core__vs__partial_only
    candidate_id: student_t_7_reduced_core
    reference_id: partial_only
    block_id: non_defining_reduced_core
    experiment_arm: current_baseline_vs_partial_only
    primary_atomic: false
    family: baseline_declaration
  - id: student_t_7_reduced_core__vs__student_t_7_combined
    candidate_id: student_t_7_reduced_core
    reference_id: student_t_7_combined
    block_id: evidence_graph_revision
    experiment_arm: current_baseline_vs_frozen_predecessor
    primary_atomic: false
    family: baseline_declaration
  - id: student_t_7_reduced_core_with_expectations__vs__student_t_7_reduced_core
    candidate_id: student_t_7_reduced_core_with_expectations
    reference_id: student_t_7_reduced_core
    block_id: inflation_expectations
    experiment_arm: add_one
    primary_atomic: true
    family: expectations_sensitivity

evaluation:
  primary_checkpoint: before_any_defining_release
  initialization_burn_in_months: 4
  information_stage_checkpoints:
    - before_any_defining_release
    - after_employment_situation
    - after_midmonth_defining_releases
    - strict_pre_final_score_day
  metrics:
    score_center_negative_log_predictive_density: lower
    quadrant_cross_entropy_to_exact_score_map: lower
    quadrant_brier_distance_to_exact_score_map: lower
    hard_quadrant_correct: higher
  subperiods:
    - full_sample
    - excluding_2020_03_through_2020_05
    - through_2022_12
    - from_2023_01
  subperiod_interpretation:
    from_2023_01: stability_diagnostic_not_untouched_holdout
  paired_block_bootstrap:
    random_seed: 20260722
    replications: 5000
    resampling: segment_aware_circular
    block_length_months: 12
    confidence_level: 0.95
    samples:
      - full_sample
      - excluding_2020_03_through_2020_05
    holm_families: {}

archived_sensitivity_namespaces:
  inference_sensitivities:
    config: configs/models/m02_inference_sensitivities.yaml
    manifest: data/manifests/m02_inference_sensitivities.json
    published_dir: >-
      results/published/m02_soft_composite/inference_sensitivities
  evidence_block_inference:
    config: configs/models/m02_evidence_block_inference.yaml
    manifest: data/manifests/m02_evidence_block_inference.json
    published_dir: >-
      results/published/m02_soft_composite/evidence_block_inference
  existing_block_attribution:
    config: configs/models/m02_existing_block_attribution.yaml
    manifest: data/manifests/m02_existing_block_attribution.json
    published_dir: >-
      results/published/m02_soft_composite/existing_block_attribution
  feature_revision:
    config: configs/models/m02_feature_revision.yaml
    manifest: data/manifests/m02_feature_revision.json
    published_dir: results/published/m02_soft_composite/feature_revision

