schema_version: 1
model_id: m02_soft_composite
stage_id: existing_block_attribution
description: >-
  Causal attribution experiment for the seven non-defining observation models
  already consumed by the selected student_t_7_combined baseline. Each atomic
  block is tested in two complementary arms: added alone to partial_only and
  removed alone from student_t_7_combined. The two inflation-pressure blocks
  are also tested jointly as a non-primary exploratory composite. This stage
  does not change the selected baseline or any upstream data artifact.

model_selection:
  baseline: student_t_7_combined
  frozen_controls:
    - transition_only
    - partial_only
    - student_t_7_combined
  role_vocabulary: [baseline, major_benchmark, sensitivity]
  selection_status: attribution_experiment_only
  candidate_specification:
    emission: student_t_7
    degrees_of_freedom: 7.0
    var: ols
    partial_defining_releases: true
    retail: baseline_nominal
  rationale: >-
    Fixing the tail treatment, transition estimator, partial defining-release
    policy, retail specification, score construction, and mapping uncertainty
    makes the enabled non-defining observation models the only experimental
    difference. No variant is promoted by this configuration.

sources:
  base_filter_config: configs/models/m02_event_driven_bayesian_filter.yaml
  frozen_sensitivity_config: configs/models/m02_inference_sensitivities.yaml
  score_manifest: data/manifests/m02_soft_composite.json
  score_features: data/processed/m02_soft_composite/composite_scores.csv
  defining_components: >-
    data/processed/m02_soft_composite/first_release_components_long.csv
  mapping_manifest: data/manifests/m02_probability_map.json
  mapping_history: >-
    results/published/m02_soft_composite/probability_map/quadrant_probabilities.csv
  evidence_manifest: data/manifests/m02_release_evidence.json
  evidence_events: >-
    data/processed/m02_soft_composite/release_evidence/release_events.csv
  frozen_sensitivity_manifest: data/manifests/m02_inference_sensitivities.json
  frozen_evaluation_rows: >-
    data/processed/m02_soft_composite/inference_sensitivities/evaluation_rows.csv
  frozen_event_update_audit: >-
    data/processed/m02_soft_composite/inference_sensitivities/event_update_audit.csv.gz
  frozen_partial_defining_audit: >-
    data/processed/m02_soft_composite/inference_sensitivities/partial_defining_audit.csv.gz
  frozen_exact_score_audit: >-
    data/processed/m02_soft_composite/inference_sensitivities/exact_score_audit.csv
  frozen_latest_marginals: >-
    results/published/m02_soft_composite/inference_sensitivities/latest_marginals.csv
  prior_evidence_experiment_manifest: >-
    data/manifests/m02_evidence_block_inference.json
  prior_evidence_experiment_evaluation_rows: >-
    data/processed/m02_soft_composite/evidence_block_inference/evaluation_rows.csv

blocks:
