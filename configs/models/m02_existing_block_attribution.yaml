    observation_models: [weekly_labor_stress]
    primary_atomic: true
  monthly_labor_demand:
    observation_models: [monthly_labor_demand]
    primary_atomic: true
  consumer_demand:
    observation_models: [consumer_demand]
    primary_atomic: true
  housing_activity:
    observation_models: [housing_activity]
    primary_atomic: true
  business_investment:
    observation_models: [business_investment]
    primary_atomic: true
  inflation_expectations:
    observation_models: [inflation_expectations]
    primary_atomic: true
  inflation_input_costs:
    observation_models: [inflation_input_costs]
    primary_atomic: true
  inflation_pressure_pair:
    observation_models:
      - inflation_expectations
      - inflation_input_costs
    primary_atomic: false

evidence_sets:
