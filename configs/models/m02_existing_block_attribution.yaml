    retail: baseline_nominal
    evidence_set: only_inflation_input_costs

  - id: leave_one_out_weekly_labor_stress
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: without_weekly_labor_stress
  - id: leave_one_out_monthly_labor_demand
    model_role: sensitivity
