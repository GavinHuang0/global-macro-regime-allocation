replacement_comparisons:
  - candidate_id: priority_03_consumer
    reference_id: leave_one_out_consumer_demand
    block_id: consumer_demand
    experiment_arm: replacement_against_reduced_core
    primary_atomic: false
  - candidate_id: priority_04_housing
    reference_id: leave_one_out_housing_activity
    block_id: housing_activity
    experiment_arm: replacement_against_reduced_core
    primary_atomic: false
  - candidate_id: priority_06_backlog
    reference_id: leave_one_out_business_investment
    block_id: business_investment
    experiment_arm: replacement_against_reduced_core
    primary_atomic: false

evaluation:
  primary_checkpoint: before_any_defining_release
  initialization_burn_in_months: 4
  information_stage_checkpoints:
    - before_any_defining_release
    - after_employment_situation
    - after_midmonth_defining_releases
    - strict_pre_final_score_day
  metrics:
    score_center_negative_log_predictive_density: lower
    quadrant_cross_entropy_to_exact_score_map: lower
    quadrant_brier_distance_to_exact_score_map: lower
    hard_quadrant_correct: higher
  paired_block_bootstrap:
    random_seed: 20260722
    replications: 5000
    resampling: circular
    block_length_months: 12
    confidence_level: 0.95
    samples:
      - full_sample
      - excluding_2020_03_through_2020_05
    holm_families:
      primary_atomic:
        - add_one_weekly_labor_stress__vs__partial_only
        - leave_one_out_weekly_labor_stress__vs__student_t_7_combined
        - add_one_monthly_labor_demand__vs__partial_only
        - leave_one_out_monthly_labor_demand__vs__student_t_7_combined
        - add_one_consumer_demand__vs__partial_only
        - leave_one_out_consumer_demand__vs__student_t_7_combined
        - add_one_housing_activity__vs__partial_only
        - leave_one_out_housing_activity__vs__student_t_7_combined
        - add_one_business_investment__vs__partial_only
        - leave_one_out_business_investment__vs__student_t_7_combined
        - add_one_inflation_expectations__vs__partial_only
        - leave_one_out_inflation_expectations__vs__student_t_7_combined
        - add_one_inflation_input_costs__vs__partial_only
        - leave_one_out_inflation_input_costs__vs__student_t_7_combined
      secondary_add_one:
        - add_one_weekly_labor_stress__vs__partial_only
        - add_one_monthly_labor_demand__vs__partial_only
        - add_one_consumer_demand__vs__partial_only
        - add_one_housing_activity__vs__partial_only
        - add_one_business_investment__vs__partial_only
        - add_one_inflation_expectations__vs__partial_only
        - add_one_inflation_input_costs__vs__partial_only
      secondary_leave_one_out:
        - leave_one_out_weekly_labor_stress__vs__student_t_7_combined
        - leave_one_out_monthly_labor_demand__vs__student_t_7_combined
        - leave_one_out_consumer_demand__vs__student_t_7_combined
        - leave_one_out_housing_activity__vs__student_t_7_combined
        - leave_one_out_business_investment__vs__student_t_7_combined
        - leave_one_out_inflation_expectations__vs__student_t_7_combined
        - leave_one_out_inflation_input_costs__vs__student_t_7_combined
      exploratory_inflation_pressure_pair:
        - add_inflation_pressure_pair__vs__partial_only
        - leave_out_inflation_pressure_pair__vs__student_t_7_combined

