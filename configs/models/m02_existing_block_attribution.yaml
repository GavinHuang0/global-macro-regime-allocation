      - monthly_labor_demand
      - consumer_demand
      - housing_activity
      - inflation_expectations
      - inflation_input_costs
  without_inflation_expectations:
    observation_models:
      - weekly_labor_stress
      - monthly_labor_demand
      - consumer_demand
      - housing_activity
      - business_investment
      - inflation_input_costs
  without_inflation_input_costs:
    observation_models:
      - weekly_labor_stress
      - monthly_labor_demand
      - consumer_demand
