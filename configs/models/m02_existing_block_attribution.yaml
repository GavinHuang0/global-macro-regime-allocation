      - monthly_labor_demand
      - consumer_demand
      - housing_activity
      - business_investment
      - inflation_expectations
      - inflation_input_costs
  without_monthly_labor_demand:
    observation_models:
      - weekly_labor_stress
      - consumer_demand
      - housing_activity
      - business_investment
      - inflation_expectations
      - inflation_input_costs
  without_consumer_demand:
