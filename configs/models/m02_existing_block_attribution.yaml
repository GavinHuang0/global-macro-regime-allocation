      - inflation_expectations
      - inflation_input_costs
  without_inflation_pressure_pair:
    observation_models:
      - weekly_labor_stress
      - monthly_labor_demand
      - consumer_demand
      - housing_activity
      - business_investment

variants:
  - id: transition_only
    model_role: major_benchmark
    non_defining_evidence: false
    partial_defining_releases: false
    emission: gaussian
    var: ols
    retail: baseline_nominal
    evidence_set: none
  - id: partial_only
    model_role: major_benchmark
    non_defining_evidence: false
    partial_defining_releases: true
    emission: gaussian
    var: ols
    retail: baseline_nominal
    evidence_set: none
  - id: student_t_7_combined
    model_role: baseline
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: all_current

  - id: add_one_weekly_labor_stress
    model_role: sensitivity
    non_defining_evidence: true
    partial_defining_releases: true
    emission: student_t_7
    var: ols
    retail: baseline_nominal
    evidence_set: only_weekly_labor_stress
  - id: add_one_monthly_labor_demand
