- series_id: RRSFS
  component: real_retail_and_food_services_log_change
  transform: log_difference
  release_id: 9
  role: evidence
  definition: St. Louis Fed real retail and food services sales, constructed from nominal RSAFS deflated
    by CPIAUCSL.
  frequency: monthly
  source_url: https://fred.stlouisfed.org/series/RRSFS
  source_definition_version: m03_sources_v1
  source_config: configs/models/m02_inference_sensitivities.yaml
  observation_start: '2000-01-01'
  vintage_start: '2001-06-01'
  vintage_end: null
  active_start: null
  active_end: null
