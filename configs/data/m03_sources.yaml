# Calendar boundaries inherit the cited M02/M01 configurations.
# A null vintage_end is open-ended; the caller must supply an explicit as-of cutoff.
# The old publication cutoff below is provenance, not a live acquisition limit.
schema_version: 1
registry_id: m03_sources_v1
provider_id: fred_api
source_definition_version: m03_sources_v1
description: Initial M03 registry of the nine M02 score sources and five reduced-core evidence inputs.
  Definitions refer to the linked FRED series pages; acquisition boundaries are configured policies,
  not verified archive inception dates.
reference_publication_vintage_end: '2026-07-20'
release_id_semantics: inherited_acquisition_configuration_not_verified_publication_timestamp
acquisition_scope: all_score_and_evidence_sources
defaults:
  observation_start: '1989-01-01'
  max_release_lag_days: 92
  archive_start_latest_only: true
sources:
- series_id: PAYEMS
  component: payrolls
  transform: log_difference
  release_id: 50
  role: score
  definition: Total nonfarm payroll employment, as defined by the FRED PAYEMS series.
  frequency: monthly
  source_url: https://fred.stlouisfed.org/series/PAYEMS
  source_definition_version: m03_sources_v1
  source_config: configs/models/m02_soft_composite.yaml
  observation_start: '1989-01-01'
  vintage_start: '1990-01-01'
  vintage_end: null
  active_start: null
  active_end: null
  vintage_start_status: configured_policy_boundary
  verified_archive_start: null
  release_timestamp_status: archive_date_only_not_verified_intraday
  axis: growth
- series_id: INDPRO
  component: industrial_production
  transform: log_difference
  release_id: 13
  role: score
  definition: Total industrial production index, as defined by the FRED INDPRO series.
  frequency: monthly
  source_url: https://fred.stlouisfed.org/series/INDPRO
  source_definition_version: m03_sources_v1
  source_config: configs/models/m02_soft_composite.yaml
  observation_start: '1989-01-01'
  vintage_start: '1990-01-01'
  vintage_end: null
  active_start: null
  active_end: null
  vintage_start_status: configured_policy_boundary
  verified_archive_start: null
  release_timestamp_status: archive_date_only_not_verified_intraday
