  vintage_start: '1996-12-11'
  vintage_end: '2016-02-17'
  active_start: null
  active_end: '2015-12-01'
  vintage_start_status: configured_policy_boundary
  verified_archive_start: null
  release_timestamp_status: archive_date_only_not_verified_intraday
  axis: inflation
  notes: Configured M02 splice uses PPILFE through December 2015 and WPSFD4131 from January 2016,
    in same-vintage changes rather than levels; this does not establish identical measurement across
    the break.
