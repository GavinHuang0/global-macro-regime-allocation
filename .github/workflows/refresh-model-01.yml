name: Refresh Model 01 data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-model-01-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Build, test, and package Model 01 outputs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository without push credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Refresh Model 01 through the authenticated FRED API
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: >-
          python -m regime_allocation.cli.build_m01_dataset
          --provider fred
          --refresh

      - name: Refresh non-defining first-release evidence through FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: >-
          python -m regime_allocation.cli.build_m01_evidence
          --provider fred
          --refresh

      - name: Fit Model 01 transition layer
        run: python -m regime_allocation.cli.build_m01_transition

      - name: Fit release likelihoods and replay Bayesian filter
        run: python -m regime_allocation.cli.build_m01_inference

      - name: Run test suite
        run: python -m pytest

      - name: Upload non-secret Model 01 outputs
        uses: actions/upload-artifact@v4
        with:
          name: model-01-refresh-${{ github.run_id }}
          path: |
            data/manifests/m01_deterministic_composite.json
            data/manifests/m01_non_defining_release_evidence.json
            data/manifests/m01_event_driven_bayesian_filter.json
            data/processed/m01_non_defining_release_evidence/*.csv
            data/processed/m01_bayesian_filter/*
            results/published/m01_deterministic_composite/
            results/published/m01_bayesian_filter/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
