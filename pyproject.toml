[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-macro-regime-allocation"
version = "0.1.0"
description = "Point-in-time macro regime nowcasting and cross-asset allocation research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.scripts]
build-m01-dataset = "regime_allocation.cli.build_m01_dataset:main"
build-m01-evidence = "regime_allocation.cli.build_m01_evidence:main"
build-m01-transition = "regime_allocation.cli.build_m01_transition:main"
build-m01-inference = "regime_allocation.cli.build_m01_inference:main"
build-m01-backtest = "regime_allocation.cli.build_m01_backtest:main"
build-m02-scores = "regime_allocation.cli.build_m02_scores:main"
build-m02-probabilities = "regime_allocation.cli.build_m02_probability_map:main"
build-m02-transition = "regime_allocation.cli.build_m02_transition:main"
build-m02-evidence = "regime_allocation.cli.build_m02_evidence:main"
build-m02-inference = "regime_allocation.cli.build_m02_inference:main"
build-m02-retail-sensitivity = "regime_allocation.cli.build_m02_retail_sensitivity:main"
build-m02-inference-sensitivities = "regime_allocation.cli.build_m02_inference_sensitivities:main"
build-m02-evidence-experiments = "regime_allocation.cli.build_m02_evidence_experiments:main"
build-m02-evidence-experiment-inference = "regime_allocation.cli.build_m02_evidence_experiment_inference:main"
build-m02-existing-block-attribution = "regime_allocation.cli.build_m02_existing_block_attribution:main"
build-m02-feature-revision = "regime_allocation.cli.build_m02_feature_revision:main"
build-m02-current-baseline = "regime_allocation.cli.build_m02_current_baseline:main"
build-m02-backtest = "regime_allocation.cli.build_m02_backtest:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
