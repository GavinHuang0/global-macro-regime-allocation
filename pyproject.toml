[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-macro-regime-allocation"
version = "0.1.0"
description = "Research framework for macro regime detection and FICC allocation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.scripts]
build-m01-dataset = "regime_allocation.cli.build_m01_dataset:main"

[project.optional-dependencies]
data = [
    "fredapi>=0.5",
    "yfinance>=0.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
